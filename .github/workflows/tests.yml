name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The parsing and file-writing logic is deliberately free of Qt imports,
      # so the test suite needs no dependencies and no display server.
      - name: Run tests
        run: python -m unittest discover -s tests -v

  desktop-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Validate the desktop entry template
        run: |
          sed -e 's|@EXEC@|/usr/local/bin/minidlna-config|' \
              -e 's|@ICON@|minidlna-config|' \
              assets/minidlna-config.desktop.in > /tmp/minidlna-config.desktop
          desktop-file-validate /tmp/minidlna-config.desktop
