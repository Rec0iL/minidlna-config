<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>MiniDLNA Configuration</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2344"/>
      <stop offset="1" stop-color="#070A16"/>
    </linearGradient>

    <!-- The violet and cyan glows from the app's animated backdrop. -->
    <radialGradient id="glowViolet" cx="0.22" cy="0.18" r="0.66">
      <stop offset="0" stop-color="#8B5CFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.84" cy="0.88" r="0.62">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="core" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6D3BFF"/>
      <stop offset="1" stop-color="#B994FF"/>
    </linearGradient>
    <!-- User-space so all three arcs share one sweep instead of each
         repeating the gradient across its own bounding box. -->
    <linearGradient id="wave" gradientUnits="userSpaceOnUse"
                    x1="70" y1="200" x2="215" y2="55">
      <stop offset="0" stop-color="#9A6BFF"/>
      <stop offset="0.55" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#28DAF0"/>
    </linearGradient>

    <clipPath id="plateClip">
      <rect x="8" y="8" width="240" height="240" rx="58"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#plate)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glowViolet)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glowCyan)"/>

    <!-- A source node with signal arcs radiating from it. -->
    <g fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-width="17">
      <path d="M147.46 162.21 A 56 56 0 0 0 99.79 114.54" opacity="0.95"/>
      <path d="M185.09 156.92 A 94 94 0 0 0 105.08 76.91" opacity="0.60"/>
      <path d="M222.72 151.63 A 132 132 0 0 0 110.37 39.28" opacity="0.34"/>
    </g>
    <path d="M62.0 170.0 L92.0 140.0 L122.0 170.0 L92.0 200.0 Z" fill="url(#core)"/>
  </g>

  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="57.25"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
